; DOOM en la badge JSConf MX 2026 (ESP32-S3-WROOM-1-N8, 8 MB flash, sin PSRAM)
[env:badge]
; pioarduino: plataforma comunitaria con Arduino-ESP32 3.x (ESP-IDF 5.5).
; La plataforma oficial "espressif32" se quedó en el core 2.x, y Arduino_GFX
; 1.6.5 requiere el 3.x. Es la misma versión que usa el firmware oficial.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; La badge no tiene una definición de placa propia; el DevKitC-1 usa el mismo
; módulo (ESP32-S3-WROOM-1), así que sirve como base y ajustamos flash abajo.
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.partitions = partitions_doom.csv

; Sin upload_port ni monitor_port a propósito: PlatformIO detecta el puerto
; de la badge solo (COMn en Windows, /dev/cu.usbmodem* en macOS, /dev/ttyACM*
; en Linux). Si hay varias placas conectadas, usa --upload-port <puerto>.
monitor_speed = 115200

build_flags =
    ; USB nativo: Serial va por el USB-Serial/JTAG, no por un UART externo.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
    ; Reloj SPI de la pantalla. 80 MHz probado y estable (41 fps); 40 MHz también funciona.
    -DTFT_SPI_HZ=80000000

lib_deps =
    https://github.com/moononournation/Arduino_GFX/archive/refs/tags/v1.6.5.zip
